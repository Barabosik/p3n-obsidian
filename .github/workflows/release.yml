# On a version tag (x.y.z with no "v", as the community directory wants): build, lint and test, then a GitHub
# release with main.js, manifest.json and styles.css, and a build provenance attestation for main.js and styles.css.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Tag matches manifest.json and versions.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version."
            exit 1
          fi
          if [ "$(node -p "require('./versions.json')['$version'] ?? ''")" = "" ]; then
            echo "::error::versions.json has no entry for $version."
            exit 1
          fi

      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css

      # Upload instead of create on a re-run, so a re-run replaces the files rather than failing.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" \
              --notes "Install from Obsidian (Settings → Community plugins → Browse → p3n) once it's listed, or copy main.js, manifest.json and styles.css into <your vault>/.obsidian/plugins/ai-pen/ and enable p3n in Settings → Community plugins."
          fi
